[build]
  command = "npm --prefix dc20-web install && npm --prefix dc20-web run build"
  publish = "dc20-web/dist"

[context.production]
  command = "npm --prefix dc20-web install && npm --prefix dc20-web run build"

[context.deploy-preview]
  command = "npm --prefix dc20-web install && npm --prefix dc20-web run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
